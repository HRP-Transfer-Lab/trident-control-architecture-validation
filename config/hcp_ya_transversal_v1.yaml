analysis:
  id: hcp_ya_transversal_v1
  milestone: M6_HCP_YA_transversal_K_C_V
  status: data_support_preflight_protocol
  question: Do lower-level K/C/V coordinates transport across attention/control, working memory and reasoning?
  formulated_after_public_stage1_to_stage3: true
  formal_claims_allowed: false
  trident_validation_claim_allowed: false
  transfer_outcomes_allowed: false
  pace_ontology_claim_allowed: false
  dynamic_regime_allowed: false
  neural_criticality_claim_allowed: false
  cusp_claim_allowed: false
  predictive_calibration_claim_allowed: false
  t_commit_claim_allowed: false

inputs:
  hcp_extract_path: data/processed/hcp_ya_transversal_extract.csv
  hcp_extract_sha256: null
  participant_id_column: Subject
  family_id_column: Family_ID
  unrelated_indicator_column: null
  family_structure_policy:
    preferred: family_isolated_cv
    acceptable_without_restricted_access: unrelated_only_sample
    ordinary_participant_folds_allowed: false
  participant_level_data_in_git_allowed: false

support_thresholds:
  minimum_complete_participants_per_domain: 100
  minimum_folds: 5
  minimum_families_per_fold: 10
  minimum_unrelated_participants: 100

predictor_sources:
  K:
    description: broad non-target performance/general capacity indicators; target-domain outcomes excluded by rule
    required_min_columns: 2
    columns:
      - NIH_Flanker_Unadj
      - NIH_ProcSpeed_Unadj
      - NIH_CardSort_Unadj
      - PicSeq_Unadj
      - ReadEng_Unadj
      - PicVocab_Unadj
  C_signal:
    description: Flanker/interference-control candidate
    required_min_columns: 1
    columns:
      - NIH_Flanker_Unadj
  V:
    description: Short Penn CPT sustained-attention/readiness candidate
    required_min_columns: 1
    columns:
      - SCPT_SEN
      - SCPT_SPEC

outcome_domains:
  attention_control:
    description: held-out attention/control outcome, if an independent indicator exists
    primary: false
    columns:
      - NIH_CardSort_Unadj
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true
  wm_list_sorting:
    description: List Sorting working memory
    primary: true
    columns:
      - ListSort_Unadj
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true
  wm_nback:
    description: task-fMRI 2-back working-memory performance
    primary: true
    columns:
      - tfMRI_WM_2bk_Acc
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true
  reasoning_pmat:
    description: Penn Progressive Matrices fluid reasoning
    primary: true
    columns:
      - PMAT24_A_CR
    secondary_columns:
      - PMAT24_A_RTCR
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true

candidate_model_sequence:
  primary_domain_models:
    - K
    - K_plus_C_signal
    - K_plus_V
    - K_plus_C_signal_plus_V
    - K_plus_C_signal_plus_V_plus_C_by_V
  coefficient_weight_comparison:
    enabled: true
    domains:
      - attention_control
      - wm_list_sorting
      - wm_nback
      - reasoning_pmat
  layer_specific_residual_tests:
    enabled: true
    wm_specific_candidate_requires_independent_indicators: true
    reasoning_specific_candidate_requires_independent_indicators: true
    no_outcome_reuse_for_specific_factor: true

validation:
  participant_or_family_isolated: true
  n_folds: 5
  split_seed: 20260820
  ridge_alpha: 1.0
  bootstrap_seed: 20260821
  bootstrap_iterations: 1000
  primary_metric: participant_isolated_heldout_predictive_log_density
  preflight_only_until_support_passes: true

decision_boundary:
  status_values:
    - data_support_passed_ready_to_freeze_analysis
    - data_support_failed
    - data_support_incomplete
  model_fitting_allowed_by_this_config: false
  hcp_model_outcome_interpretation_allowed: false

outputs:
  output_dir: reports/generated/hcp_ya_transversal_v1
  protocol_md: research-program/M6_HCP_YA_TRANSVERSAL_PROTOCOL_V1.md
  preflight_report_md: research-program/M6_HCP_YA_TRANSVERSAL_PREFLIGHT.md
