analysis:
  id: hcp_ya_transversal_v1
  milestone: M6_0a_HCP_YA_source_schema_and_construct_hardening
  status: data_support_preflight_protocol
  question: Do lower-level K/C_candidate/V coordinates transport across attention/control, working memory and reasoning?
  formulated_after_public_stage1_to_stage3: true
  formal_claims_allowed: false
  trident_validation_claim_allowed: false
  transfer_outcomes_allowed: false
  pace_ontology_claim_allowed: false
  dynamic_regime_allowed: false
  neural_criticality_claim_allowed: false
  cusp_claim_allowed: false
  predictive_calibration_claim_allowed: false
  t_commit_claim_allowed: false

inputs:
  hcp_extract_path: data/processed/hcp_ya_transversal_extract.csv
  hcp_extract_sha256: null
  extract_schema_path: config/hcp_ya_transversal_extract_schema_v1.yaml
  cohort_mode: hcp_100_unrelated
  cohort_provenance:
    official_hcp_100_unrelated_subjects_group_declared: true
    official_group_name: HCP 100 Unrelated Subjects
    access_route: ConnectomeDB powered by BALSA
    exported_from_official_group: true
  participant_id_column: Subject
  family_id_column: null
  unrelated_indicator_column: null
  participant_isolated_cv_allowed: true
  family_isolated_cv_required: false
  family_structure_policy:
    preferred: explicit_unrelated_only_participant_isolated_cv
    acceptable_without_restricted_access: hcp_100_unrelated
    ordinary_participant_folds_allowed: false
  participant_level_data_in_git_allowed: false

support_thresholds:
  minimum_complete_participants_per_domain: 100
  minimum_folds: 5
  minimum_families_per_fold: 10
  minimum_unrelated_participants: 100

predictor_sources:
  K:
    description: broad non-target performance/general capacity indicators; excludes Flanker, Card Sort, List Sorting, 2-back, PMAT and global cognition composites
    required_min_columns: 2
    columns:
      - ProcSpeed_Unadj
      - PicSeq_Unadj
      - ReadEng_Unadj
      - PicVocab_Unadj
  C_candidate:
    description: Flanker inhibitory-control/attention candidate; not yet C_signal as a confirmed mechanism
    required_min_columns: 1
    columns:
      - Flanker_Unadj
  V:
    description: Short Penn CPT sustained-attention/readiness candidate
    required_min_columns: 1
    columns:
      - SCPT_SEN
      - SCPT_SPEC

outcome_domains:
  attention_control:
    description: held-out attention/control outcome, if an independent indicator exists
    primary: false
    required_for_support: true
    columns:
      - CardSort_Unadj
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true
  wm_list_sorting:
    description: List Sorting working memory
    primary: true
    required_for_support: true
    columns:
      - ListSort_Unadj
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true
  wm_nback:
    description: optional aggregate task-fMRI 2-back working-memory field; known HCP aggregate-calculation concern pending resolution
    primary: false
    required_for_support: false
    analysis_eligible: false
    status: optional_known_issue_pending
    future_route: independently reconstructed task/run/trial-level 2-back accuracy or official HCP resolution required before inference
    columns:
      - WM_Task_2bk_Acc
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true
  reasoning_pmat:
    description: Penn Progressive Matrices fluid reasoning
    primary: true
    required_for_support: true
    columns:
      - PMAT24_A_CR
    secondary_columns:
      - PMAT24_A_RTCR
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true
  reasoning_relational:
    description: optional relational-processing behavioural performance summary, if available in local HCP export
    primary: false
    required_for_support: false
    analysis_eligible: false
    columns:
      - Relational_Task_Acc
    anti_circularity:
      exclude_from_K_when_target: true
      must_not_overlap_C_or_V: true

candidate_model_sequence:
  primary_domain_models:
    - K
    - K_plus_C_candidate
    - K_plus_V
    - K_plus_C_candidate_plus_V
    - K_plus_C_candidate_plus_V_plus_C_by_V
  coefficient_weight_comparison:
    enabled: true
    domains:
      - attention_control
      - wm_list_sorting
      - reasoning_pmat
  layer_specific_residual_tests:
    enabled: true
    wm_specific_candidate_requires_independent_indicators: true
    reasoning_specific_candidate_requires_independent_indicators: true
    no_outcome_reuse_for_specific_factor: true

validation:
  participant_or_family_isolated: true
  n_folds: 5
  split_seed: 20260820
  ridge_alpha: 1.0
  bootstrap_seed: 20260821
  bootstrap_iterations: 1000
  primary_metric: participant_isolated_heldout_predictive_log_density
  preflight_only_until_support_passes: true

decision_boundary:
  status_values:
    - data_support_passed_ready_to_freeze_analysis
    - data_support_failed
    - data_support_incomplete
  model_fitting_allowed_by_this_config: false
  hcp_model_outcome_interpretation_allowed: false

outputs:
  output_dir: reports/generated/hcp_ya_transversal_v1
  protocol_md: research-program/M6_HCP_YA_TRANSVERSAL_PROTOCOL_V1.md
  preflight_report_md: research-program/M6_HCP_YA_TRANSVERSAL_PREFLIGHT.md
