registry:
  id: hrp_stack_variable_registry_v2
  milestone: M3_variable_architecture_v2
  status: frozen_for_mechanistic_synthetic_design
  formal_claims_allowed: false
  real_transfer_outcomes_allowed: false
  trident_validation_claim_allowed: false
  neural_criticality_claim_allowed: false
  cusp_required: false

variables:
  K:
    label: stable_capacity
    role: stable person/layer capacity and baseline ability
    timescale: person_or_layer
    measurement_status: latent_candidate
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: false
    observable_families:
      - baseline_accuracy
      - baseline_response_speed
      - baseline_throughput
      - stable_rt_variability
      - load_capacity
    negative_controls:
      - do_not_label_slow_baseline_as_overload
      - do_not_treat_capacity_as_temporary_regime

  V:
    label: vigilance_readiness
    role: sufficient stable activation for adaptive control deployment
    timescale: session_or_block
    measurement_status: latent_candidate
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: false
    observable_families:
      - lapses
      - omissions
      - time_on_task_slope
      - sustained_attention_stability
      - readiness_moderation
    negative_controls:
      - do_not_identify_vigilance_with_pace
      - do_not_identify_vigilance_with_trident_state

  C_signal:
    label: signal_recovery
    role: quality of task-relevant representation under interference
    timescale: trial_block_session
    measurement_status: latent_candidate
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: false
    observable_families:
      - conflict_accuracy_cost
      - lure_resistance
      - representation_recovery_after_switch
      - signal_noise_discrimination
    negative_controls:
      - do_not_equate_with_general_speed

  A_evidence:
    label: evidence_updating
    role: accumulation, weighting and updating from diagnostic evidence
    timescale: trial_to_block
    measurement_status: latent_candidate
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: false
    observable_families:
      - change_point_adaptation
      - post_error_adjustment
      - evidence_weighting
      - update_magnitude_distribution
      - serial_dependence
    negative_controls:
      - do_not_infer_from_accuracy_alone

  T_commit:
    label: commit_threshold
    role: stopping policy and decision timing under uncertainty or urgency
    timescale: trial_to_block
    measurement_status: latent_candidate
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: false
    observable_families:
      - speed_accuracy_tradeoff
      - deadline_response_policy
      - hesitation_latency
      - premature_commit_rate
    negative_controls:
      - do_not_equate_fast_with_regulated

  PC_calibration:
    label: predictive_calibration
    role: calibration of prediction strength, confidence and source reliability
    timescale: block_session
    measurement_status: latent_candidate
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: false
    observable_families:
      - confidence_calibration
      - prediction_error_sensitivity
      - source_reliability_weighting
      - uncertainty_adjustment
    negative_controls:
      - do_not_claim_without_confidence_or_prediction_observable

  R_dynamic:
    label: dynamic_regime
    role: temporary execution/adaptation regime
    timescale: window_session
    measurement_status: latent_candidate
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: false
    candidate_regimes:
      - compiled
      - adaptive_corridor
      - mi_locked
      - entropy_excess
      - generic_hidden_state
    observable_families:
      - temporal_autocorrelation
      - regime_persistence
      - transition_rate
      - recovery_after_perturbation
      - convergence_after_large_update
    negative_controls:
      - literal_cusp_is_late_competitor_not_required
      - do_not_call_regime_a_brain_state

  P_pace:
    label: pace_expression
    role: descriptive phenotype or independently supported latent policy
    timescale: block_session
    measurement_status: descriptive_until_independently_supported
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: false
    categories:
      - regulated
      - compensatory
      - brittle
      - overloaded
    observable_families:
      - speed_accuracy_variability_pattern
      - compensation_pattern
      - overload_pattern
      - brittle_fast_error_pattern
    negative_controls:
      - do_not_force_four_profiles
      - do_not_treat_pace_as_natural_kind_without_identifiability

  Y_behavior:
    label: observable_behavior
    role: measured task behaviour generated by latent variables and nuisance
    timescale: trial_window_session
    measurement_status: observed
    allowed_in_synthetic_truth: false
    can_define_transfer_outcome: false
    observable_families:
      - accuracy
      - response_time
      - response_speed
      - throughput
      - rt_variability
      - lapses
      - error_bursts
      - serial_persistence
      - post_error_adjustment

  Transfer_external:
    label: external_transfer_outcome
    role: held-out wrapper perturbation criterion for later prospective app tests
    timescale: prospective_heldout
    measurement_status: external_criterion
    allowed_in_synthetic_truth: true
    can_define_transfer_outcome: true
    forbidden_as_latent_input: true
    observable_families:
      - first_contact_dip
      - recovery_slope
      - recovery_latency
      - recovered_asymptote
      - return_cost
      - hysteresis
      - heldout_wrapper_performance
      - delayed_survival
    negative_controls:
      - do_not_define_latent_state_using_transfer
      - freeze_predictions_before_real_transfer_outcome_inspection

causal_families:
  MECH0:
    label: general_capacity_only
    synthetic_truth: K -> Y_behavior
    generated_variables:
      - K
      - Y_behavior
    primary_competitor: static_continuous_apc
    identifiability_question: can apparent control structure be explained by K alone

  MECH1:
    label: static_continuous_apc
    synthetic_truth: K + C_signal + A_evidence + T_commit + PC_calibration -> Y_behavior
    generated_variables:
      - K
      - C_signal
      - A_evidence
      - T_commit
      - PC_calibration
      - Y_behavior
    primary_competitor: general_capacity_only
    identifiability_question: can APC dimensions be recovered beyond K

  MECH2:
    label: vigilance_gated_apc
    synthetic_truth: K + V + APC + V_by_APC -> Y_behavior
    generated_variables:
      - K
      - V
      - C_signal
      - A_evidence
      - T_commit
      - PC_calibration
      - Y_behavior
    primary_competitor: static_continuous_apc
    identifiability_question: can vigilance be separated from control efficacy

  MECH3:
    label: profile_causes_control
    synthetic_truth: P_pace -> APC_configuration -> Y_behavior
    generated_variables:
      - P_pace
      - C_signal
      - A_evidence
      - T_commit
      - PC_calibration
      - Y_behavior
    primary_competitor: continuous_apc_causes_apparent_pace
    identifiability_question: can discrete profiles be distinguished from continuous APC regions

  MECH4:
    label: continuous_apc_causes_apparent_pace
    synthetic_truth: APC_region -> Y_behavior -> coarse_P_pace_expression
    generated_variables:
      - C_signal
      - A_evidence
      - T_commit
      - PC_calibration
      - P_pace
      - Y_behavior
    primary_competitor: profile_causes_control
    identifiability_question: does PACE add causal structure or describe APC space

  MECH5:
    label: dynamic_regime_plus_apc
    synthetic_truth: K + V + APC + R_dynamic -> Y_behavior
    generated_variables:
      - K
      - V
      - C_signal
      - A_evidence
      - T_commit
      - PC_calibration
      - R_dynamic
      - Y_behavior
    primary_competitor: static_continuous_apc
    identifiability_question: do temporary regimes add held-out prediction beyond static APC

  MECH6:
    label: adaptive_corridor_dynamics
    synthetic_truth: K + V + APC + regulated_corridor_updating -> Y_behavior
    generated_variables:
      - K
      - V
      - C_signal
      - A_evidence
      - T_commit
      - PC_calibration
      - R_dynamic
      - Y_behavior
    primary_competitor: generic_ar_or_hmm_dynamics
    identifiability_question: can adaptive-corridor dynamics beat generic dynamics when true

  MECH7:
    label: lock_excess_update_failure_modes
    synthetic_truth: K + V + APC + mi_lock_or_entropy_excess -> Y_behavior
    generated_variables:
      - K
      - V
      - C_signal
      - A_evidence
      - T_commit
      - PC_calibration
      - R_dynamic
      - Y_behavior
    primary_competitor: adaptive_corridor_dynamics
    identifiability_question: can successful adaptation be separated from lock and excess updating

identifiability_gates:
  - id: K_only_vs_APC
    truth_families:
      - MECH0
      - MECH1
    required_result: APC should not be claimed unless distinguishable beyond K.
  - id: APC_vs_vigilance_gated_APC
    truth_families:
      - MECH1
      - MECH2
    required_result: V and APC must be separable before vigilance-gating claims.
  - id: profile_vs_continuous_region
    truth_families:
      - MECH3
      - MECH4
    required_result: PACE/profile ontology requires recovery beyond continuous APC regions.
  - id: static_vs_dynamic
    truth_families:
      - MECH1
      - MECH5
    required_result: R_dynamic must improve held-out prediction when generated.
  - id: generic_vs_adaptive_corridor
    truth_families:
      - MECH5
      - MECH6
    required_result: adaptive corridor claims require advantage over generic AR/HMM/HSMM.
  - id: adaptive_vs_failure_modes
    truth_families:
      - MECH6
      - MECH7
    required_result: recovery must be distinguishable from lock and excess-update failure.

later_external_transfer_variables:
  prediction_freeze_required: true
  allowed_only_after_mechanistic_identifiability: true
  outcomes:
    - first_contact_dip
    - recovery_slope
    - recovery_latency
    - recovered_asymptote
    - return_cost
    - hysteresis
    - heldout_wrapper_performance
    - delayed_survival
