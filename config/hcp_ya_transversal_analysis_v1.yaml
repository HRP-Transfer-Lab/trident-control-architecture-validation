analysis:
  id: hcp_ya_transversal_analysis_v1
  milestone: M6_HCP_YA_transversal_K_C_candidate_V_analysis
  status: locked_pending_passed_support_preflight
  question: Can the same individual K/C_candidate/V coordinates transport across attention, working memory and reasoning while weights and layer-specific residuals vary by representational level?
  depends_on_preflight_config: config/hcp_ya_transversal_v1.yaml
  required_preflight_status: data_support_passed_ready_to_freeze_analysis
  current_preflight_summary_path: reports/generated/hcp_ya_transversal_v1/preflight_summary.json
  formal_claims_allowed: false
  trident_validation_claim_allowed: false
  transfer_outcomes_allowed: false
  pace_ontology_claim_allowed: false
  dynamic_regime_allowed: false
  neural_criticality_claim_allowed: false
  cusp_claim_allowed: false
  predictive_calibration_claim_allowed: false
  t_commit_claim_allowed: false
  model_fitting_enabled: false
  requires_later_analysis_freeze_commit: true

inputs:
  hcp_extract_path: data/processed/hcp_ya_transversal_extract.csv
  extract_schema_path: config/hcp_ya_transversal_extract_schema_v1.yaml
  participant_level_data_in_git_allowed: false
  family_structure_policy:
    primary: family_isolated_cv
    fallback_if_no_restricted_family_access: unrelated_only_sample
    ordinary_participant_folds_allowed: false

coordinate_sources:
  K:
    description: broad non-target performance/general capacity indicators; excludes Flanker, Card Sort, List Sorting, 2-back, PMAT and global cognition composites
    columns:
      - ProcSpeed_Unadj
      - PicSeq_Unadj
      - ReadEng_Unadj
      - PicVocab_Unadj
  C_candidate:
    description: Flanker inhibitory-control/attention candidate; not yet C_signal as a confirmed mechanism
    columns:
      - Flanker_Unadj
  V:
    description: Short Penn CPT sustained-attention/readiness candidate
    columns:
      - SCPT_SEN
      - SCPT_SPEC

outcome_domains:
  attention_control:
    primary: false
    required_for_support: true
    columns:
      - CardSort_Unadj
    anti_circularity:
      exclude_outcome_from_K: true
      forbid_overlap_with_C_or_V: true
  wm_list_sorting:
    primary: true
    required_for_support: true
    columns:
      - ListSort_Unadj
    anti_circularity:
      exclude_outcome_from_K: true
      forbid_overlap_with_C_or_V: true
  wm_nback:
    primary: true
    required_for_support: true
    columns:
      - WM_Task_2bk_Acc
    anti_circularity:
      exclude_outcome_from_K: true
      forbid_overlap_with_C_or_V: true
  reasoning_pmat:
    primary: true
    required_for_support: true
    columns:
      - PMAT24_A_CR
    secondary_columns:
      - PMAT24_A_RTCR
    anti_circularity:
      exclude_outcome_from_K: true
      forbid_overlap_with_C_or_V: true
  reasoning_relational:
    primary: false
    required_for_support: false
    columns:
      - Relational_Task_Acc
    anti_circularity:
      exclude_outcome_from_K: true
      forbid_overlap_with_C_or_V: true

primary_model_sequence:
  - id: K
    predictors:
      - K
  - id: K_plus_C_candidate
    predictors:
      - K
      - C_candidate
  - id: K_plus_V
    predictors:
      - K
      - V
  - id: K_plus_C_candidate_plus_V
    predictors:
      - K
      - C_candidate
      - V
  - id: K_plus_C_candidate_plus_V_plus_C_by_V
    predictors:
      - K
      - C_candidate
      - V
      - C_candidate_by_V

domain_weight_test:
  enabled: true
  coefficient_table:
    rows:
      - attention_control
      - wm_list_sorting
      - wm_nback
      - reasoning_pmat
      - reasoning_relational
    columns:
      - K
      - C_candidate
      - V
  interpretation_boundary: coefficient differences are domain-demand diagnostics, not mechanism validation

layer_specific_residual_tests:
  enabled_after_primary_transport_only: true
  wm_specific:
    status: blocked_until_independent_indicators_registered
    candidate_indicators: []
  reasoning_specific:
    status: blocked_until_independent_indicators_registered
    candidate_indicators:
      - Relational_Task_Acc
  no_outcome_reuse_for_specific_factor: true

validation:
  primary_metric: family_or_unrelated_isolated_heldout_predictive_log_density
  n_folds: 5
  split_seed: 20260822
  ridge_alpha: 1.0
  bootstrap_seed: 20260823
  bootstrap_iterations: 1000
  all_scaling_inside_training_folds: true
  outcome_specific_K_exclusion_required: true

decision_plan:
  transversal_support_pattern_labels:
    - K_C_V_predict_all_domains
    - K_C_V_predict_all_domains_with_different_weights
    - K_only_transports_C_V_attention_local
    - layer_specific_residuals_remain
    - no_transversal_support
    - inconclusive
  no_confirmatory_claim_from_single_dataset: true
  nki_replication_required_for_transport_claim: true

outputs:
  output_dir: reports/generated/hcp_ya_transversal_analysis_v1
  protocol_md: research-program/M6_HCP_YA_TRANSVERSAL_ANALYSIS_PROTOCOL_V1.md
  plan_report_md: research-program/M6_HCP_YA_TRANSVERSAL_ANALYSIS_PLAN.md
