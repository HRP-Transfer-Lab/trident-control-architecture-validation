analysis:
  id: public_stage2_pace_expression_v1
  milestone: M5_stage2_descriptive_PACE_expression
  status: pre_outcome_registered_analysis
  question: Do regulated / brittle / compensatory / overloaded expressions add predictive structure beyond continuous K/C/V?
  formal_claims_allowed: false
  trident_validation_claim_allowed: false
  transfer_outcomes_allowed: false
  pace_ontology_claim_allowed: false
  forced_four_profile_claim_allowed: false
  dynamic_regime_allowed: false
  neural_criticality_claim_allowed: false
  cusp_claim_allowed: false

inputs:
  paired_session_features_path: ../../.tmp-zone-replication/flow-zone-zone-validation/data/processed/paired_vigilance_session_features.parquet
  paired_session_features_sha256: DD30838E96FBC1A80C42D0CD41161644B1563BCCC3901B39AB9E9A1DED0065A0
  upstream_repository: HRP-Transfer-Lab/flow-zone-zone-validation
  upstream_commit: 2d8d479befd73155d2215c1fef80a60cd27eaa5b
  stage1_report_commit: 3276fcf150a5d7646ea439aeb84bb07cf3d42019

identity_columns:
  participant_id: participant_id
  session_id: session_id
  session_order: session_type
  session_order_values:
    online: 0
    lab1: 1
    lab2: 2

forbidden_columns:
  - low_engagement_candidate
  - high_engagement_candidate
  - control_profile
  - control_profile_probability

feature_groups:
  K:
    columns:
      stroop_accuracy: 1
      flanker_accuracy: 1
      stroop_mean_rt_ms: -1
      flanker_mean_rt_ms: -1
      stroop_throughput: 1
      flanker_throughput: 1
  C_signal:
    columns:
      stroop_interference_rt_ms: -1
      flanker_interference_rt_ms: -1
      stroop_interference_accuracy: -1
      flanker_interference_accuracy: -1
  V:
    columns:
      sart_commission_rate: -1
      sart_omission_rate: -1
      sart_anticipatory_rate: -1
      sart_go_rt_cv: -1
      sart_pre_failure_speeding_ms: -1

pairing:
  adjacent_sessions_only: true
  minimum_observed_sessions_per_participant: 2

pace_expression:
  derived_inside_training_folds_only: true
  descriptive_only: true
  threshold_source: training_fold_medians
  indicators:
    regulated:
      rule: K_high & C_signal_high & V_high
    brittle:
      rule: K_high & C_signal_high & V_low
    compensatory:
      rule: K_low & (C_signal_high | V_high)
    overloaded:
      rule: K_low & C_signal_low & V_low

validation:
  participant_isolated: true
  n_folds: 5
  split_seed: 20260811
  ridge_alpha: 1.0
  bootstrap_seed: 20260812
  bootstrap_iterations: 1000
  ci: 0.95

candidate_models:
  continuous_K_C_V:
    predictors:
      - K
      - C_signal
      - V
  continuous_K_C_V_plus_descriptive_PACE_expression:
    predictors:
      - K
      - C_signal
      - V
      - regulated
      - brittle
      - compensatory
      - overloaded
  PACE_expression_only_negative_control:
    predictors:
      - regulated
      - brittle
      - compensatory
      - overloaded

targets:
  Y_behavior_next:
    groups:
      - K
      - C_signal
      - V
    primary_contrast: continuous_K_C_V_plus_descriptive_PACE_expression_minus_continuous_K_C_V
  K_next:
    groups:
      - K
  C_signal_next:
    groups:
      - C_signal
  V_next:
    groups:
      - V

decision_rule:
  status_values:
    - pace_expression_increment_supported
    - pace_expression_increment_not_supported
    - inconclusive
  require_no_forbidden_columns_used: true
  require_participant_isolated_scores_finite: true
  primary_increment_mean_minimum: 0.0
  primary_increment_ci_lower_tolerance: -0.005
  disconfirm_primary_increment_ci_upper_maximum: 0.0
  negative_control_must_not_exceed_continuous_baseline: true

outputs:
  output_dir: reports/generated/public_stage2_pace_expression_v1
  report_md: research-program/M5_STAGE2_PACE_EXPRESSION_REAL_DATA_ANALYSIS.md
