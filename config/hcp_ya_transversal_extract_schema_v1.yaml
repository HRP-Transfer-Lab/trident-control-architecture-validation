schema:
  id: hcp_ya_transversal_extract_schema_v1
  status: local_extract_schema_no_participant_data
  target_path: data/processed/hcp_ya_transversal_extract.csv
  participant_level_data_in_git_allowed: false
  model_fitting_allowed: false
  purpose: define the local HCP-YA behavioural extract needed for transversal K/C_candidate/V preflight

source_provenance:
  hcp_release: HCP-Young Adult 2025
  non_imaging_data_status: unchanged from S1200 release according to HCP-YA 2025 release notes
  access_route: ConnectomeDB powered by BALSA
  data_dictionary: HCP_S1200_DataDictionary_Oct_30_2023
  source_mapping_required_before_outcome_fitting: true

identity:
  required:
    Subject:
      hcp_source_column: Subject
      canonical_column: Subject
      description: HCP participant identifier
      restricted: false
    Family_ID:
      hcp_source_column: Family_ID
      canonical_column: Family_ID
      description: family identifier for family-isolated cross-validation
      restricted: true
      alternative_if_unavailable: provide an unrelated-only extract and configure unrelated indicator before analysis
  optional:
    Unrelated:
      hcp_source_column: Unrelated
      canonical_column: Unrelated
      description: boolean indicator for unrelated-only cohort membership if restricted family structure is unavailable
      restricted: false

predictor_candidates:
  K:
    columns:
      ProcSpeed_Unadj:
        hcp_source_column: ProcSpeed_Unadj
        canonical_column: ProcSpeed_Unadj
        role: processing-speed/general performance candidate
      PicSeq_Unadj:
        hcp_source_column: PicSeq_Unadj
        canonical_column: PicSeq_Unadj
        role: non-target general cognitive performance candidate
      ReadEng_Unadj:
        hcp_source_column: ReadEng_Unadj
        canonical_column: ReadEng_Unadj
        role: non-target general cognitive performance candidate
      PicVocab_Unadj:
        hcp_source_column: PicVocab_Unadj
        canonical_column: PicVocab_Unadj
        role: non-target general cognitive performance candidate
  C_candidate:
    columns:
      Flanker_Unadj:
        hcp_source_column: Flanker_Unadj
        canonical_column: Flanker_Unadj
        role: Flanker inhibitory-control/attention candidate; not entered into K
  V:
    columns:
      SCPT_SEN:
        hcp_source_column: SCPT_SEN
        canonical_column: SCPT_SEN
        role: Short Penn CPT sensitivity/sustained-attention candidate
      SCPT_SPEC:
        hcp_source_column: SCPT_SPEC
        canonical_column: SCPT_SPEC
        role: Short Penn CPT specificity/sustained-attention candidate

heldout_outcomes:
  attention_control:
    primary: false
    required_for_support: true
    columns:
      CardSort_Unadj:
        hcp_source_column: CardSort_Unadj
        canonical_column: CardSort_Unadj
        role: attention/control held-out outcome candidate
  wm_list_sorting:
    primary: true
    required_for_support: true
    columns:
      ListSort_Unadj:
        hcp_source_column: ListSort_Unadj
        canonical_column: ListSort_Unadj
        role: List Sorting working-memory outcome
  wm_nback:
    primary: false
    required_for_support: false
    analysis_eligible: false
    status: optional_known_issue_pending
    issue: HCP Users reported an unresolved concern about released aggregate WM_Task_2bk_Acc calculation in February 2026
    future_route: independently reconstruct 2-back accuracy from task E-Prime/run/trial-level files or use only after HCP resolution
    columns:
      WM_Task_2bk_Acc:
        hcp_source_column: WM_Task_2bk_Acc
        canonical_column: WM_Task_2bk_Acc
        role: optional aggregate 2-back working-memory field; not primary/support-required while known issue is unresolved
        note: not used for scientific inference by this primary support gate
  reasoning_pmat:
    primary: true
    required_for_support: true
    columns:
      PMAT24_A_CR:
        hcp_source_column: PMAT24_A_CR
        canonical_column: PMAT24_A_CR
        role: PMAT correct responses / fluid reasoning accuracy
      PMAT24_A_RTCR:
        hcp_source_column: PMAT24_A_RTCR
        canonical_column: PMAT24_A_RTCR
        role: PMAT median correct-response RT; secondary diagnostic
  reasoning_relational:
    primary: false
    required_for_support: false
    analysis_eligible: false
    columns:
      Relational_Task_Acc:
        hcp_source_column: Relational_Task_Acc
        canonical_column: Relational_Task_Acc
        role: optional relational-processing behavioural performance indicator if available

anti_circularity:
  outcome_column_must_not_define_same_domain_predictor: true
  list_sorting_excluded_from_K_when_wm_outcome: true
  pmat_excluded_from_K_when_reasoning_outcome: true
  flanker_excluded_from_K: true
  card_sort_excluded_from_K: true
  global_cognition_composites_forbidden_in_K: true
  c_signal_and_v_must_not_overlap_heldout_outcomes: true
  ordinary_participant_folds_allowed: false

local_template:
  command: python -m trident_validation.mechanistic.hcp_extract_schema --schema config/hcp_ya_transversal_extract_schema_v1.yaml --write-template
  writes_participant_rows: false
